; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:d1_mini]
platform = platformio/espressif8266@4.2.1
board = d1_mini
board_build.f_cpu = 160000000L
framework = arduino
build_flags = -w
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@6.21.5
    arkhipenko/TaskScheduler@3.7.0
    me-no-dev/ESPAsyncTCP@1.2.2
    ESP8266TrueRandom=https://github.com/marvinroger/ESP8266TrueRandom.git#9b9db7ee50a1c9edd73c6a721330d54496e98e88
    FastLED=https://github.com/coryking/FastLED.git#672c90fb9906f3359ddb61de6b83490a7e2cf21f
    painlessMesh=https://gitlab.com/painlessMesh/painlessMesh.git#731f94cb25ab8bba730a5748c681990599dd7621
